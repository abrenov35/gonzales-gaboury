<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Contrôle mobile — Gonzales Gaboury</title><style>body{font:14px system-ui;background:#e8e9e7;margin:20px;color:#193f46}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{padding:10px}iframe{display:block;border:1px solid #a4b2b1;margin:15px auto;background:white;max-width:100%}pre{white-space:pre-wrap}#status{font-size:12px}</style><header><b>Contrôle mobile · largeur iPhone</b><select id="width"><option>375</option><option selected>390</option><option>430</option></select><button id="home">Accueil</button><button id="photos">Photos</button><button id="products">Sanitaires</button><button id="budget">Budget</button><button id="choices">Vos choix</button><button id="check">Contrôler</button></header><pre id="status">Chargement…</pre><iframe id="preview" width="390" height="844" title="Aperçu mobile du site public" src="./index.html"></iframe><script>const f=document.getElementById('preview');function check(){const d=f.contentDocument;const imgs=[...d.images];document.getElementById('status').textContent='Largeur : '+d.documentElement.clientWidth+' px | Contenu : '+d.documentElement.scrollWidth+' px | Débordement horizontal : '+(d.documentElement.scrollWidth>d.documentElement.clientWidth?'OUI':'NON')+' | Images chargées : '+imgs.filter(i=>i.complete&&i.naturalWidth>0).length+'/'+imgs.length+' | Budget : '+(d.getElementById('budget').innerText.includes('13 431')?'13 431 € TTC confirmé':'À vérifier');}f.addEventListener('load',check);document.getElementById('width').onchange=e=>{f.width=e.target.value;setTimeout(check,300)};for(const [id,target] of [['home','accueil'],['photos','photos'],['products','sanitaires'],['budget','budget'],['choices','choix']])document.getElementById(id).onclick=()=>{f.contentDocument.getElementById(target).scrollIntoView();setTimeout(check,500)};document.getElementById('check').onclick=check;</script></html>
